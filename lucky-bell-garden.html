# desc: Three handmade songs in a little rhythm garden. Catch the bells in time.
import pyxel, math

W,H=256,192
INK=1; PAPER=7; RED=8; GOLD=10; SAGE=11; LILAC=13; SKY=12
HIT_Y=128
SONGS=[
 (&#x27;FIRST LIGHT&#x27;, 15, [0,1,2,1,0,1,2,1,2,0,1,0,2,1,0,2,1,0,1,2,1,0,2,1]),
 (&#x27;GARDEN RAIN&#x27;, 13, [0,2,1,0,1,2,0,1,2,1,0,2,1,2,0,1,0,2,1,0,2,1,2,0,1,2,0,1,2,0,1,2]),
 (&#x27;NIGHT PARADE&#x27;, 11, [1,0,2,1,2,0,1,0,2,1,0,2,2,1,0,2,0,1,2,0,1,2,1,0,2,1,0,2,1,0,2,1,0,1,2,0,2,1,0,2])]

def cat(cx,cy,scale=1,wave=0):
 def rect(x,y,w,h,c):pyxel.rect(cx+x*scale,cy+y*scale,w*scale,h*scale,c)
 def line(x,y,xx,yy,c):pyxel.line(cx+x*scale,cy+y*scale,cx+xx*scale,cy+yy*scale,c)
 def circ(x,y,r,c):pyxel.circ(cx+x*scale,cy+y*scale,max(1,r*scale),c)
 circ(-13,18,5,INK);circ(-13,18,3,PAPER)
 rect(-12,5,25,28,INK);rect(-10,5,21,26,PAPER)
 circ(0,7,13,INK);circ(0,8,11,PAPER)
 pyxel.tri(cx-12*scale,cy+1*scale,cx-10*scale,cy-12*scale,cx-1*scale,cy-7*scale,INK)
 pyxel.tri(cx+3*scale,cy-7*scale,cx+12*scale,cy-12*scale,cx+12*scale,cy+1*scale,INK)
 pyxel.tri(cx-10*scale,cy-1*scale,cx-9*scale,cy-8*scale,cx-5*scale,cy-5*scale,RED)
 pyxel.tri(cx+6*scale,cy-5*scale,cx+10*scale,cy-8*scale,cx+10*scale,cy-1*scale,RED)
 circ(-5,7,1,INK);circ(5,7,1,INK);circ(0,10,1,RED)
 line(-3,12,0,13,INK);line(0,13,3,12,INK)
 for y in (9,12):line(-10,y,-16,y-1,INK);line(10,y,16,y-1,INK)
 rect(-9,17,18,3,RED);circ(0,20,2,INK)
 circ(0,27,5,INK);circ(0,27,4,GOLD);line(-2,27,2,27,INK)
 up=int(bool(wave));rect(11,-2-up*3,6,19,INK);rect(12,-1-up*3,4,16,PAPER)
 circ(14,-4-up*3,4,INK);circ(14,-4-up*3,2,PAPER)

class Game:
 def __init__(self):
  pyxel.init(W,H,title=&#x27;Lucky Cat Bell Garden&#x27;,fps=30)
  self.song=0;self.best=[0,0,0];self.state=&#x27;menu&#x27;;self.pulse=0;self.particles=[]
  for i,m in enumerate([&#x27;T180 O4 C16 E16 G16&#x27;,&#x27;T180 O4 E16 G16 &gt; C16&#x27;,&#x27;T180 O4 G16 &gt; C16 E16&#x27;]):pyxel.sounds[i].mml(m)
  pyxel.sounds[3].mml(&#x27;T90 O3 G16 E16 C8&#x27;)
  pyxel.sounds[4].mml(&#x27;T210 O5 C16 G16 C16&#x27;)
  pyxel.run(self.update,self.draw)
 def begin(self):
  title,beat,melody=SONGS[self.song]
  self.beat=beat;self.chart=[]
  for i,lane in enumerate(melody):
   # A deliberate space between phrases gives the player room to breathe.
   phrase=i//8;step=i%8
   when=68+(phrase*9+step)*beat
   self.chart.append((when,lane))
  self.state=&#x27;playing&#x27;;self.frame=0;self.next=0;self.judged=set()
  self.score=0;self.combo=0;self.max_combo=0;self.perfect=0;self.good=0;self.misses=0;self.life=6
  self.particles=[];self.banner=&#x27;&#x27;;self.banner_time=0;self.hit_flash=[0,0,0]
 def hit(self,lane):
  if self.state!=&#x27;playing&#x27;:return
  nearest=-1;offset=10000
  for j,(when,which) in enumerate(self.chart):
   if j in self.judged or which!=lane:continue
   delta=abs(self.frame-when)
   if delta&lt;offset:nearest=j;offset=delta
  if offset&lt;=5:
   self.judged.add(nearest);self.combo+=1;self.max_combo=max(self.max_combo,self.combo)
   if offset&lt;=2:self.perfect+=1;self.score+=300+min(200,self.combo*5);self.banner=&#x27;PERFECT&#x27;;pyxel.play(0,lane)
   else:self.good+=1;self.score+=150+min(100,self.combo*3);self.banner=&#x27;GOOD&#x27;;pyxel.play(0,lane)
   self.banner_time=17;self.hit_flash[lane]=10;self.pulse=8
   x=51+lane*77
   for k in range(8):self.particles.append([x,HIT_Y,(k-4)*.75,-1.5-(k%3)*.5,14,GOLD if k%2 else RED])
  else:
   self.banner=&#x27;EARLY / LATE&#x27;;self.banner_time=12;self.combo=0
 def update(self):
  if self.state==&#x27;menu&#x27;:
   if pyxel.btnp(pyxel.KEY_LEFT) or pyxel.btnp(pyxel.KEY_A):self.song=(self.song-1)%3;pyxel.play(0,1)
   if pyxel.btnp(pyxel.KEY_RIGHT) or pyxel.btnp(pyxel.KEY_D):self.song=(self.song+1)%3;pyxel.play(0,1)
   if pyxel.btnp(pyxel.KEY_SPACE) or pyxel.btnp(pyxel.KEY_RETURN) or pyxel.btnp(pyxel.GAMEPAD1_BUTTON_A):self.begin()
   elif pyxel.btnp(pyxel.MOUSE_BUTTON_LEFT):
    if pyxel.mouse_y&lt;102:self.song=(self.song+(1 if pyxel.mouse_x&gt;128 else -1))%3
    else:self.begin()
   return
  if self.state==&#x27;result&#x27;:
   if pyxel.btnp(pyxel.KEY_SPACE) or pyxel.btnp(pyxel.KEY_RETURN) or pyxel.btnp(pyxel.MOUSE_BUTTON_LEFT):self.state=&#x27;menu&#x27;
   return
  if pyxel.btnp(pyxel.KEY_ESCAPE):self.state=&#x27;menu&#x27;;return
  self.frame+=1
  if self.banner_time:self.banner_time-=1
  if self.pulse:self.pulse-=1
  self.hit_flash=[max(0,n-1) for n in self.hit_flash]
  for i,k in enumerate((pyxel.KEY_A,pyxel.KEY_S,pyxel.KEY_D)):
   if pyxel.btnp(k) or pyxel.btnp((pyxel.KEY_LEFT,pyxel.KEY_DOWN,pyxel.KEY_RIGHT)[i]) or pyxel.btnp((pyxel.GAMEPAD1_BUTTON_X,pyxel.GAMEPAD1_BUTTON_A,pyxel.GAMEPAD1_BUTTON_B)[i]):self.hit(i)
  if pyxel.btnp(pyxel.MOUSE_BUTTON_LEFT) and 35&lt;pyxel.mouse_y&lt;155:
   self.hit(max(0,min(2,(pyxel.mouse_x-15)//77)))
  for j,(when,lane) in enumerate(self.chart):
   if j not in self.judged and self.frame&gt;when+5:
    self.judged.add(j);self.misses+=1;self.life-=1;self.combo=0
    self.banner=&#x27;MISS&#x27;;self.banner_time=14;pyxel.play(1,3)
    if self.life&lt;=0:break
  for p in self.particles[:]:
   p[0]+=p[2];p[1]+=p[3];p[3]+=.13;p[4]-=1
   if p[4]&lt;=0:self.particles.remove(p)
  if self.life&lt;=0 or len(self.judged)==len(self.chart):
   self.state=&#x27;result&#x27;;self.best[self.song]=max(self.best[self.song],self.score)
   if self.life&gt;0:pyxel.play(0,4)
 def garden(self):
  pyxel.cls(PAPER)
  for y in range(31,159,17):
   pyxel.line(0,y,255,y,13 if y%2 else 6)
  for x in (8,248):
   pyxel.line(x,38,x,158,INK)
   for y in (50,75,101,135):
    pyxel.line(x,y,x+(-5 if x&gt;128 else 5),y-8,SAGE)
    pyxel.circ(x+(-5 if x&gt;128 else 5),y-8,2,RED)
  for lane in range(3):
   left=17+lane*77
   pyxel.rect(left,37,68,112,6 if lane==1 else PAPER)
   pyxel.rectb(left,37,68,112,INK)
   pyxel.line(left+1,119,left+66,119,INK)
   pyxel.circ(left+34,HIT_Y,13,INK)
   pyxel.circ(left+34,HIT_Y,11,GOLD if self.hit_flash[lane] else PAPER)
   pyxel.circ(left+34,HIT_Y,3,RED)
   pyxel.text(left+31,143,&#x27;ASD&#x27;[lane],INK)
  if self.state==&#x27;playing&#x27;:
   for j,(when,lane) in enumerate(self.chart):
    if j in self.judged:continue
    y=HIT_Y-(when-self.frame)*2.2
    if y&lt;30 or y&gt;148:continue
    x=51+lane*77
    pyxel.tri(x-10,y-4,x+10,y-4,x,y+7,INK)
    pyxel.tri(x-7,y-3,x+7,y-3,x,y+4,GOLD)
    pyxel.circ(x,y+7,2,RED)
   for x,y,dx,dy,ttl,color in self.particles:pyxel.circ(x,y,1,color)
  pyxel.rect(0,0,W,30,INK);pyxel.text(8,6,&#x27;BELL GARDEN&#x27;,PAPER)
  pyxel.text(114,6,&#x27;%06d&#x27;%self.score,GOLD)
  pyxel.text(183,6,&#x27;CHAIN %02d&#x27;%self.combo,PAPER)
  pyxel.text(8,18,SONGS[self.song][0],SAGE)
  pyxel.text(144,18,&#x27;HEARTS &#x27;+&#x27;*&#x27;*max(0,self.life),RED)
  pyxel.rect(0,159,W,33,PAPER);pyxel.line(0,159,W,159,INK)
  cat(33,166,1,self.pulse and self.pulse%4&lt;2)
  pyxel.text(75,166,&#x27;A / S / D   OR TAP THE BELLS&#x27;,INK)
  pyxel.text(75,178,&#x27;RING AT THE RED MARK&#x27;,RED)
  if self.state==&#x27;playing&#x27; and self.banner_time:pyxel.text(105,151,self.banner,RED if self.banner==&#x27;MISS&#x27; else INK)
 def draw(self):
  self.garden()
  if self.state==&#x27;menu&#x27;:
   pyxel.rect(16,40,224,113,PAPER);pyxel.rectb(16,40,224,113,INK)
   pyxel.rect(17,41,222,16,INK);pyxel.text(35,46,&#x27;THREE SONGS / ONE GARDEN&#x27;,PAPER)
   cat(52,91,1,pyxel.frame_count//15%2)
   pyxel.text(108,72,&#x27;&lt; &#x27;+SONGS[self.song][0]+&#x27; &gt;&#x27;,INK)
   pyxel.text(108,88,&#x27;%02d BELLS  /  %d BPM&#x27;%(len(SONGS[self.song][2]),1800//SONGS[self.song][1]),RED)
   pyxel.text(108,103,&#x27;BEST %06d&#x27;%self.best[self.song],INK)
   pyxel.rect(91,122,133,20,RED);pyxel.text(107,129,&#x27;TAP / SPACE TO PLAY&#x27;,PAPER)
  elif self.state==&#x27;result&#x27;:
   count=len(self.chart);accuracy=(self.perfect*100+self.good*60)//count
   grade=&#x27;S&#x27; if accuracy&gt;=95 and self.life&gt;0 else (&#x27;A&#x27; if accuracy&gt;=80 and self.life&gt;0 else (&#x27;B&#x27; if accuracy&gt;=60 and self.life&gt;0 else &#x27;C&#x27;))
   pyxel.rect(21,40,214,113,PAPER);pyxel.rectb(21,40,214,113,INK)
   pyxel.rect(22,41,212,18,INK);pyxel.text(35,47,&#x27;GARDEN IN HARMONY&#x27; if self.life&gt;0 else &#x27;THE BELLS FELL SILENT&#x27;,PAPER)
   pyxel.text(37,69,&#x27;GRADE&#x27;,INK);pyxel.text(39,83,grade,GOLD if self.life&gt;0 else RED)
   pyxel.text(88,69,&#x27;SCORE  %06d&#x27;%self.score,INK)
   pyxel.text(88,83,&#x27;ACCURACY  %02d%%&#x27;%accuracy,RED)
   pyxel.text(88,96,&#x27;PERFECT %02d  GOOD %02d&#x27;%(self.perfect,self.good),INK)
   pyxel.text(88,108,&#x27;MISSED %02d   BEST %06d&#x27;%(self.misses,self.best[self.song]),INK)
   pyxel.text(46,132,&#x27;TAP / SPACE : SONG SELECT&#x27;,RED)
Game()" gamepad="enabled"></pyxel-run><script>document.querySelectorAll('[data-key]').forEach(b=>{let code=b.dataset.key;let key=code.slice(-1).toLowerCase(); b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);document.dispatchEvent(new KeyboardEvent('keydown',{key,code,bubbles:true}))});for(const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev,()=>document.dispatchEvent(new KeyboardEvent('keyup',{key,code,bubbles:true})))})</script></body></html>
